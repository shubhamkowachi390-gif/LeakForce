[package]
name = "leakforce"
version = "1.0.0"
description = "LeakForce - authorized lab security scanner"
authors = ["LeakForce"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "leakforce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "net", "time", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream", "charset", "http2"] }
futures = "0.3"
regex = "1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
scraper = "0.20"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
